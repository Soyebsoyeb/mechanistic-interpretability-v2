<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="640" height="460" fill="#faf8f4"/>
  <text x="320" y="36" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">Measurement pyramid: strength of evidence</text>

  <!-- pyramid built from 4 trapezoids, bottom = weakest, top = strongest -->
  <polygon points="120,380 520,380 460,300 180,300" fill="#e8e1d0" stroke="#a9977a" stroke-width="1.2"/>
  <polygon points="180,300 460,300 410,225 230,225" fill="#dccfaa" stroke="#a9977a" stroke-width="1.2"/>
  <polygon points="230,225 410,225 372,150 268,150" fill="#cdb987" stroke="#a9977a" stroke-width="1.2"/>
  <polygon points="268,150 372,150 320,80  320,80" fill="#b8975b" stroke="#a9977a" stroke-width="1.2"/>

  <text x="320" y="345" text-anchor="middle" font-size="14" fill="#3a3324" font-weight="bold">Linear probe</text>
  <text x="320" y="268" text-anchor="middle" font-size="14" fill="#3a3324" font-weight="bold">Nonlinear probe</text>
  <text x="320" y="193" text-anchor="middle" font-size="13.5" fill="#3a3324" font-weight="bold">Mutual information</text>
  <text x="320" y="123" text-anchor="middle" font-size="13" fill="#3a2a12" font-weight="bold">Causal</text>
  <text x="320" y="138" text-anchor="middle" font-size="13" fill="#3a2a12" font-weight="bold">intervention</text>

  <line x1="560" y1="380" x2="560" y2="90" stroke="#5b4636" stroke-width="2" marker-end="url(#arrowp)"/>
  <defs>
    <marker id="arrowp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b4636"/>
    </marker>
  </defs>
  <text x="600" y="235" text-anchor="middle" font-size="12" fill="#5b4636" transform="rotate(-90 600 235)">strength of evidence</text>

  <text x="320" y="420" text-anchor="middle" font-size="12.5" fill="#6b6153">Each level up costs more compute and yields a stronger claim about mechanism.</text>
</svg>
