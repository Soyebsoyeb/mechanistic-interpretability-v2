<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="460" fill="#faf8f4"/>
  <text x="450" y="36" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">Representational structures in a 2D slice of R^d</text>

  <!-- Panel 1: single neuron (axis) -->
  <g>
    <rect x="30" y="60" width="200" height="200" fill="#ffffff" stroke="#c9beae"/>
    <line x1="30" y1="160" x2="230" y2="160" stroke="#ddd3c0"/>
    <line x1="130" y1="60" x2="130" y2="260" stroke="#2b6a2f" stroke-width="2.5"/>
    <text x="134" y="72" font-size="12" fill="#2b6a2f">h_i axis</text>
    <text x="130" y="288" text-anchor="middle" font-size="13" fill="#3a3324" font-weight="bold">Single neuron</text>
    <text x="130" y="304" text-anchor="middle" font-size="11" fill="#6b6153">f(h) = h_i</text>
  </g>

  <!-- Panel 2: direction (line through origin, not axis-aligned) -->
  <g>
    <rect x="250" y="60" width="200" height="200" fill="#ffffff" stroke="#c9beae"/>
    <line x1="250" y1="160" x2="450" y2="160" stroke="#ddd3c0"/>
    <line x1="350" y1="60" x2="350" y2="260" stroke="#ddd3c0"/>
    <line x1="280" y1="240" x2="420" y2="80" stroke="#a3492b" stroke-width="2.5"/>
    <text x="360" y="95" font-size="12" fill="#a3492b">v</text>
    <text x="350" y="288" text-anchor="middle" font-size="13" fill="#3a3324" font-weight="bold">Direction</text>
    <text x="350" y="304" text-anchor="middle" font-size="11" fill="#6b6153">f(h) = v&#8407;&#183;h</text>
  </g>

  <!-- Panel 3: subspace (shaded band) -->
  <g>
    <rect x="470" y="60" width="200" height="200" fill="#ffffff" stroke="#c9beae"/>
    <line x1="470" y1="160" x2="670" y2="160" stroke="#ddd3c0"/>
    <line x1="570" y1="60" x2="570" y2="260" stroke="#ddd3c0"/>
    <polygon points="490,240 650,90 650,120 490,270" fill="#5b7fae" fill-opacity="0.35" stroke="#2f4f7a" stroke-width="1.5"/>
    <text x="600" y="105" font-size="12" fill="#2f4f7a">span(V)</text>
    <text x="570" y="288" text-anchor="middle" font-size="13" fill="#3a3324" font-weight="bold">Subspace</text>
    <text x="570" y="304" text-anchor="middle" font-size="11" fill="#6b6153">f(h) = ||P_V h||</text>
  </g>

  <!-- Panel 4: nonlinear manifold (curve) -->
  <g>
    <rect x="690" y="60" width="200" height="200" fill="#ffffff" stroke="#c9beae"/>
    <line x1="690" y1="160" x2="890" y2="160" stroke="#ddd3c0"/>
    <line x1="790" y1="60" x2="790" y2="260" stroke="#ddd3c0"/>
    <path d="M 710 240 C 760 100, 820 100, 870 200" fill="none" stroke="#7a3f8f" stroke-width="2.5"/>
    <text x="800" y="112" font-size="12" fill="#7a3f8f">M = &#966;(h)</text>
    <text x="790" y="288" text-anchor="middle" font-size="13" fill="#3a3324" font-weight="bold">Nonlinear manifold</text>
    <text x="790" y="304" text-anchor="middle" font-size="11" fill="#6b6153">f(h) = g(&#966;(h))</text>
  </g>

  <text x="450" y="350" text-anchor="middle" font-size="13" fill="#5b4636" font-style="italic">
    Axes are a choice of coordinates; directions, subspaces, and manifolds are choices of basis-free geometry.
  </text>
  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#5b4636" font-style="italic">
    Only geometry that is invariant under an orthogonal change of basis can be a claim about the function itself.
  </text>
</svg>
