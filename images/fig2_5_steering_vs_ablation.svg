<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="420" fill="#faf8f4"/>
  <text x="450" y="36" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">Steering versus ablation</text>

  <!-- Left panel: steering -->
  <g>
    <rect x="30" y="60" width="400" height="300" fill="#ffffff" stroke="#c9beae"/>
    <text x="230" y="86" text-anchor="middle" font-size="14" fill="#3a3324" font-weight="bold">Steering: h + scale &#183; v</text>
    <line x1="60" y1="330" x2="400" y2="330" stroke="#ddd3c0"/>
    <line x1="230" y1="90" x2="230" y2="330" stroke="#ddd3c0"/>

    <circle cx="180" cy="260" r="6" fill="#4a72a3"/>
    <text x="160" y="248" font-size="12" fill="#4a72a3">h_natural</text>

    <line x1="180" y1="260" x2="320" y2="150" stroke="#a3492b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrows1)"/>
    <circle cx="320" cy="150" r="6" fill="#a3492b"/>
    <text x="330" y="145" font-size="12" fill="#a3492b">h_intervened</text>
    <text x="220" y="215" font-size="11" fill="#6b6153">scale &#183; v</text>
  </g>

  <!-- Right panel: ablation -->
  <g>
    <rect x="470" y="60" width="400" height="300" fill="#ffffff" stroke="#c9beae"/>
    <text x="670" y="86" text-anchor="middle" font-size="14" fill="#3a3324" font-weight="bold">Ablation: h &#8722; P_V h</text>
    <line x1="500" y1="330" x2="840" y2="330" stroke="#ddd3c0"/>
    <line x1="670" y1="90" x2="670" y2="330" stroke="#ddd3c0"/>

    <!-- the flattening subspace, drawn as a horizontal line (span V) -->
    <line x1="520" y1="250" x2="820" y2="250" stroke="#7fa370" stroke-width="2"/>
    <text x="825" y="246" font-size="11" fill="#2f5d2f">span(V)</text>

    <circle cx="600" cy="150" r="6" fill="#4a72a3"/>
    <text x="580" y="138" font-size="12" fill="#4a72a3">h</text>
    <line x1="600" y1="150" x2="600" y2="250" stroke="#a3492b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrows2)"/>
    <circle cx="600" cy="250" r="6" fill="#a3492b"/>
    <text x="610" y="270" font-size="12" fill="#a3492b">h_ablated = (I&#8722;P_V)h</text>
  </g>

  <defs>
    <marker id="arrows1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a3492b"/>
    </marker>
    <marker id="arrows2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a3492b"/>
    </marker>
  </defs>

  <text x="450" y="392" text-anchor="middle" font-size="12.5" fill="#6b6153">Steering displaces the point along a chosen direction; ablation projects out an entire subspace, flattening it to zero.</text>
</svg>
