<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="420" fill="#faf8f4"/>

  <!-- Left panel: dense full graph -->
  <text x="200" y="34" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">Full computational graph G</text>
  <rect x="30" y="55" width="340" height="320" rx="6" fill="#ffffff" stroke="#c9beae" stroke-width="1.5"/>

  <g id="dense-nodes" stroke="#b7a88e" stroke-width="0.6">
    <!-- generate a dense mesh manually as a grid with cross edges -->
  </g>

  <!-- edges (drawn first, under nodes) -->
  <g stroke="#cbbfa6" stroke-width="0.7" opacity="0.8">
    <!-- column pairs -->
    <line x1="70" y1="90"  x2="150" y2="140"/><line x1="70" y1="90"  x2="150" y2="190"/><line x1="70" y1="90"  x2="150" y2="240"/>
    <line x1="70" y1="130" x2="150" y2="90"/><line x1="70" y1="130" x2="150" y2="190"/><line x1="70" y1="130" x2="150" y2="290"/>
    <line x1="70" y1="170" x2="150" y2="140"/><line x1="70" y1="170" x2="150" y2="240"/><line x1="70" y1="170" x2="150" y2="90"/>
    <line x1="70" y1="210" x2="150" y2="190"/><line x1="70" y1="210" x2="150" y2="290"/><line x1="70" y1="210" x2="150" y2="340"/>
    <line x1="70" y1="250" x2="150" y2="140"/><line x1="70" y1="250" x2="150" y2="240"/><line x1="70" y1="250" x2="150" y2="340"/>
    <line x1="70" y1="290" x2="150" y2="90"/><line x1="70" y1="290" x2="150" y2="190"/><line x1="70" y1="290" x2="150" y2="290"/>
    <line x1="70" y1="330" x2="150" y2="140"/><line x1="70" y1="330" x2="150" y2="240"/><line x1="70" y1="330" x2="150" y2="340"/>

    <line x1="150" y1="90"  x2="230" y2="120"/><line x1="150" y1="90"  x2="230" y2="200"/>
    <line x1="150" y1="140" x2="230" y2="160"/><line x1="150" y1="140" x2="230" y2="260"/>
    <line x1="150" y1="190" x2="230" y2="120"/><line x1="150" y1="190" x2="230" y2="200"/><line x1="150" y1="190" x2="230" y2="320"/>
    <line x1="150" y1="240" x2="230" y2="160"/><line x1="150" y1="240" x2="230" y2="260"/>
    <line x1="150" y1="290" x2="230" y2="200"/><line x1="150" y1="290" x2="230" y2="320"/>
    <line x1="150" y1="340" x2="230" y2="260"/><line x1="150" y1="340" x2="230" y2="320"/>

    <line x1="230" y1="120" x2="330" y2="180"/>
    <line x1="230" y1="160" x2="330" y2="180"/>
    <line x1="230" y1="200" x2="330" y2="180"/>
    <line x1="230" y1="260" x2="330" y2="180"/>
    <line x1="230" y1="320" x2="330" y2="180"/>
  </g>

  <g fill="#8a7554">
    <circle cx="70" cy="90" r="4"/><circle cx="70" cy="130" r="4"/><circle cx="70" cy="170" r="4"/>
    <circle cx="70" cy="210" r="4"/><circle cx="70" cy="250" r="4"/><circle cx="70" cy="290" r="4"/><circle cx="70" cy="330" r="4"/>
    <circle cx="150" cy="90" r="4"/><circle cx="150" cy="140" r="4"/><circle cx="150" cy="190" r="4"/>
    <circle cx="150" cy="240" r="4"/><circle cx="150" cy="290" r="4"/><circle cx="150" cy="340" r="4"/>
    <circle cx="230" cy="120" r="4"/><circle cx="230" cy="160" r="4"/><circle cx="230" cy="200" r="4"/>
    <circle cx="230" cy="260" r="4"/><circle cx="230" cy="320" r="4"/>
    <circle cx="330" cy="180" r="5"/>
  </g>
  <text x="200" y="400" text-anchor="middle" font-size="12" fill="#6b6153" font-style="italic">O(10^5) edges, no direct semantics</text>

  <!-- Arrow with map label -->
  <g>
    <line x1="382" y1="215" x2="490" y2="215" stroke="#5b4636" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="436" y="200" text-anchor="middle" font-size="15" fill="#5b4636" font-style="italic">&#960;: V &#8594; V&#39;</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b4636"/>
    </marker>
  </defs>

  <!-- Right panel: simplified circuit graph -->
  <text x="700" y="34" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">Simplified graph G&#39;</text>
  <rect x="510" y="55" width="360" height="320" rx="6" fill="#ffffff" stroke="#c9beae" stroke-width="1.5"/>

  <g stroke="#5b4636" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="600" y1="120" x2="690" y2="215"/>
    <line x1="600" y1="310" x2="690" y2="215"/>
    <line x1="690" y1="215" x2="790" y2="215"/>
  </g>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b4636"/>
    </marker>
  </defs>

  <g>
    <rect x="540" y="95" width="120" height="50" rx="8" fill="#eadfc6" stroke="#a98f5f" stroke-width="1.5"/>
    <text x="600" y="125" text-anchor="middle" font-size="14" fill="#3a3324">Edges (L1)</text>

    <rect x="540" y="285" width="120" height="50" rx="8" fill="#eadfc6" stroke="#a98f5f" stroke-width="1.5"/>
    <text x="600" y="315" text-anchor="middle" font-size="14" fill="#3a3324">Textures (L2)</text>

    <rect x="630" y="190" width="120" height="50" rx="8" fill="#dbe8d8" stroke="#7fa370" stroke-width="1.5"/>
    <text x="690" y="220" text-anchor="middle" font-size="14" fill="#2f3d29">Merge node</text>

    <rect x="740" y="190" width="120" height="50" rx="8" fill="#f0dcc9" stroke="#c08a4e" stroke-width="1.5"/>
    <text x="800" y="220" text-anchor="middle" font-size="14" fill="#4a2f16">Objects (L3)</text>
  </g>
  <text x="700" y="400" text-anchor="middle" font-size="12" fill="#6b6153" font-style="italic">4 nodes, human-interpretable, behavior-preserving</text>
</svg>
