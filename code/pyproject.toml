[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-interpretability"
version = "0.1.0"
description = "Research textbook companion code for mechanistic interpretability"
requires-python = ">=3.9"
authors = [{name = "MD Soyeb Hoque"}]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "transformers>=4.30.0",
    "einops>=0.6.0",
    "tqdm>=4.65.0",
    "pytest>=7.3.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["black", "flake8", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
