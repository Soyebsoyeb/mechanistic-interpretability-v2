experiment:
  seed: 42
  device: cuda
  batch_size: 32

model:
  name: gpt2
  revision: main
  tokenizer: gpt2

training:
  epochs: 100
  lr: 1e-3
  weight_decay: 0.01

sae:
  expansion_factor: 8
  l1_coefficient: 1e-3
  dead_feature_threshold: 1e-8

evaluation:
  n_samples: 1000
  confidence_level: 0.95
